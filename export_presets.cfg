ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'\nDestroy-Process -Name '{exe_name}' -ErrorAction SilentlyContinue\nStart-Sleep -Seconds 1\n$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'\nRegister-ScheduledTask -TaskName godot_remote_debug -Action $action -Force:$true\nStart-ScheduledTask -TaskName godot_remote_debug\nWhile Get-ScheduledTask -TaskName godot_remote_debug | ? State -eq Running { Start-Sleep -Seconds 1 }\nUnregister-ScheduledTask -TaskName godot_remote_debug -Confirm:$false -ErrorAction SilentlyContinue"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName godot_remote_debug -ErrorAction SilentlyContinue\nUnregister-ScheduledTask -TaskName godot_remote_debug -Confirm:$false -ErrorAction SilentlyContinue\nDestroy-Process -Name '{exe_name}' -ErrorAction SilentlyContinue\nRemove-Item -Recurse -Force '{temp_dir}'"
